<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff8a32">
<title>気分で選ぶ！柑橘診断</title>
<style>
*{box-sizing:border-box}
:root{--orange:#ff8736;--yellow:#ffc74b;--green:#3b914e;--cream:#fff9ee;--ink:#3c2a20;--muted:#7d6c60}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff7e5,#fffdfa 52%,#f5ffe9);color:var(--ink);min-height:100vh}
button{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh}
header{text-align:center;padding:26px 18px 17px}.eyebrow{display:inline-block;background:#fff0b8;color:#775d28;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px}
h1{margin:0;font-size:clamp(30px,8vw,42px);line-height:1.18;color:#ef6923}h1 span{color:var(--green)}
.lead{margin:11px auto 0;max-width:360px;color:var(--muted);font-size:14px;line-height:1.8}
main{padding:0 14px 34px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(237,170,91,.25);border-radius:28px;box-shadow:0 18px 46px rgba(89,55,24,.11);padding:20px 16px}
.progress-wrap{margin-bottom:21px}.progress-meta{display:flex;justify-content:space-between;color:#8d786a;font-size:12px;margin-bottom:7px}.progress-track{height:8px;background:#f3eae2;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:999px;transition:width .3s}
.screen{animation:fade .27s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.start{text-align:center}.hero-fruit{font-size:92px;filter:drop-shadow(0 8px 10px rgba(170,95,20,.13))}.start h2{font-size:26px;margin:7px 0 9px}.start p{color:var(--muted);font-size:14px;line-height:1.85;margin:0}
.primary,.retry{width:100%;border:0;border-radius:20px;min-height:60px;margin-top:20px;background:linear-gradient(135deg,var(--orange),#ffae3c);color:white;font-size:18px;font-weight:850;cursor:pointer;box-shadow:0 10px 24px rgba(237,120,30,.22)}
.q-icon{width:72px;height:72px;margin:0 auto 12px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#fff2cc,#ffe09a);border:1px solid #ffda94;font-size:37px}
.q-kicker{text-align:center;color:#d77829;font-size:12px;font-weight:850;letter-spacing:.1em}
.question{text-align:center;margin:7px 0 19px;font-size:24px;line-height:1.45}.choices{display:grid;gap:10px}
.choice{width:100%;border:1px solid #f1dfcc;border-radius:18px;background:#fff9f2;min-height:60px;padding:11px 13px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink);font-size:15px;font-weight:760;cursor:pointer;box-shadow:0 5px 13px rgba(80,50,25,.045)}
.choice:hover{background:#fff2df}.choice:active,.primary:active,.retry:active,.nav-btn:active{transform:scale(.985)}
.choice-emoji{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:13px;background:white;font-size:21px}.choice-text{flex:1}.choice-arrow{font-size:23px;color:#dc955b}
.nav{display:flex;gap:9px;margin-top:16px}.nav-btn{flex:1;border:0;border-radius:15px;min-height:47px;background:#f2eee9;color:#73665e;font-size:13px;font-weight:750;cursor:pointer}.nav-btn:disabled{opacity:.4}
.result{text-align:center}.result-tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#e6f8d8;color:#2e803c;font-size:12px;font-weight:850;letter-spacing:.09em}.result-fruit{font-size:94px;margin-top:8px}.result h2{font-size:36px;color:#e56520;margin:2px 0 3px}.match{font-size:14px;font-weight:850;color:#40874b;margin-bottom:6px}.catch{color:#6a5346;font-size:16px;font-weight:750;line-height:1.65;margin:0 0 15px}
.reason{text-align:left;padding:16px;border-radius:18px;background:linear-gradient(145deg,#fff4d9,#fffaf0);border:1px solid #ffe1aa;font-size:14px;line-height:1.75;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left}.info{padding:13px;border-radius:16px;background:#f8f8f2;min-height:88px}.wide{grid-column:1/-1}.info-label{font-size:11px;color:#8e8177;font-weight:850;margin-bottom:5px}.info-value{font-size:13px;line-height:1.58;font-weight:700}
.runnerups{margin-top:14px;text-align:left;background:#f5fbef;border-radius:17px;padding:13px}.runnerups h3{font-size:13px;margin:0 0 9px;color:#3c8148}.runnerup{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid #e2edda}.runnerup:first-of-type{border-top:0}
.retry{background:var(--green);font-size:16px;min-height:54px}.hidden{display:none!important}
footer{text-align:center;color:#958477;font-size:11px;line-height:1.7;padding:0 24px 24px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="eyebrow">その日の気分 × 好み × シーン</div>
<h1>気分で選ぶ！<br><span>柑橘診断</span></h1>
<p class="lead">8つの質問から、今のあなたに合う柑橘を診断します。</p>
</header>

<main><section class="card">
<div class="progress-wrap hidden" id="progressWrap">
<div class="progress-meta"><span>あなたにぴったりの柑橘を診断中</span><span id="progressText">1 / 8</span></div>
<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div>
<div id="content"></div>
</section></main>

<footer>味わいや旬には個体差・産地差があります。気分に合わせた柑橘選びの参考としてお楽しみください。</footer>
</div>

<script>
const fruitKeys=["unshu","benimadonna","kanpei","iyokan","dekopon","jabara","harehime","setoka","karamandarin"];

const fruits={
unshu:{name:"温州みかん",emoji:"🍊",catchcopy:"気軽でやさしい、みんなの定番。",taste:"甘みと酸味のバランスがよく、時期によって味わいが変わります。",texture:"やさしく食べやすい",season:"9月〜2月頃",sweetness:"10〜11度程度",eat:"手でむいて薄皮ごとそのまま。",reason:"手軽さ、親しみやすさ、家族みんなで食べやすいことを重視した回答と相性が高い柑橘です。"},
benimadonna:{name:"紅まどんな",emoji:"🍊",catchcopy:"ゼリーのような口どけの、ご褒美柑橘。",taste:"濃厚な甘みと芳醇な香り。",texture:"とろける・なめらか",season:"12月〜1月頃",sweetness:"12〜13度程度",eat:"カットして丁寧に味わうのがおすすめ。",reason:"とろける食感、濃厚な甘さ、贈り物や特別感を重視した回答と強く合っています。"},
kanpei:{name:"甘平",emoji:"🍊",catchcopy:"シャキッと食感と高糖度の特別感。",taste:"酸味が少なく、濃厚な甘さ。",texture:"シャキシャキ",season:"2月〜3月頃",sweetness:"13〜15度程度",eat:"薄皮ごと食べられます。",reason:"高い甘さ、シャキシャキ感、少し奮発してでも特別なものを楽しみたい気分と相性が高いです。"},
iyokan:{name:"いよかん",emoji:"🍊",catchcopy:"香り豊かで、じゅわっと爽快。",taste:"濃厚な甘さと程よい酸味、力強い香り。",texture:"じゅわっと果汁たっぷり",season:"12月〜2月頃",sweetness:"10〜12度程度",eat:"皮をむき、薄皮を避けて食べるのが一般的。",reason:"元気にいきたい、爽やかな香りや果汁感を楽しみたい回答にぴったりです。"},
dekopon:{name:"デコポン",emoji:"🍊",catchcopy:"甘さと酸味、食べやすさのバランス派。",taste:"濃厚な甘さと程よい酸味。",texture:"プリっと弾力感",season:"2月〜3月頃",sweetness:"12〜13度程度",eat:"手でむいてそのまま。",reason:"しっかりした甘さ、プリっとした食感、食べやすさをバランスよく求める回答と合っています。"},
jabara:{name:"じゃばら",emoji:"🍋",catchcopy:"キリッと酸味で、気分をリセット。",taste:"強い香りとしっかりした酸味。",texture:"果汁を楽しむタイプ",season:"12月〜2月頃",sweetness:"甘さ控えめ・酸味しっかり",eat:"絞ってドリンクや料理に。",reason:"スッキリ切り替えたい、酸味や香りを楽しみたい、料理やドリンクに使いたい回答との相性が高いです。"},
harehime:{name:"はれひめ",emoji:"🍊",catchcopy:"やさしい甘さと爽やかさで、ほっと一息。",taste:"やさしい甘みとオレンジのような爽やかな香り。",texture:"やさしくジューシー",season:"1月〜3月頃",sweetness:"10度前後",eat:"手でむいて薄皮ごと。",reason:"癒されたい、爽やかだけど刺激は強すぎない味を求める回答と相性が高いです。"},
setoka:{name:"せとか",emoji:"🍊",catchcopy:"濃厚な甘みと香りを味わう、大人のご褒美。",taste:"非常に濃厚な甘みと芳醇な香り。",texture:"やわらかくジューシー",season:"2月〜3月頃",sweetness:"13〜15度程度",eat:"カットしてゆっくり味わうのがおすすめ。",reason:"濃厚な甘さと香り、夜のひとり時間や特別な贅沢を求める回答と強く合っています。"},
karamandarin:{name:"カラマンダリン",emoji:"🍊",catchcopy:"定番から一歩外へ。新しい味との出会い。",taste:"甘みと酸味のバランスがよく、爽やかな香り。",texture:"小ぶりでジューシー",season:"12月〜2月頃",sweetness:"10〜12度程度",eat:"手でむいて気軽に。",reason:"新しい味に出会いたい、小粒で食べやすいものを楽しみたい回答との相性が高いです。"}
};

const questions=[
{
title:"今の気分",icon:"🌿",options:[
["元気にいきたい","☀️",{iyokan:4,dekopon:2,jabara:2,harehime:1}],
["ホッと癒されたい","🍵",{harehime:4,unshu:3,benimadonna:1}],
["自分にご褒美","🎁",{benimadonna:4,setoka:4,kanpei:3}],
["スッキリ切り替えたい","✨",{jabara:5,iyokan:3,harehime:2}],
["疲れて甘い物がほしい","💗",{kanpei:4,setoka:4,benimadonna:4,dekopon:2}],
["新しい味に出会いたい","🧭",{karamandarin:5,jabara:3,kanpei:2,harehime:1}]
]},
{
title:"どんなシーンで食べたい？",icon:"🕒",options:[
["朝ごはん・サクッと一品","🌅",{unshu:5,harehime:3,karamandarin:2}],
["おやつ・デザートタイム","🍰",{benimadonna:4,setoka:4,kanpei:3,dekopon:2}],
["贈り物・おもてなし","🎀",{benimadonna:5,setoka:4,kanpei:4}],
["料理やドリンク","🥤",{jabara:6,iyokan:2}],
["仕事や勉強の合間","📚",{unshu:4,dekopon:3,karamandarin:3}],
["家族みんなで","👨‍👩‍👧‍👦",{unshu:6,dekopon:3,harehime:2}],
["外出先・運動のあと","🏃",{unshu:4,karamandarin:3,iyokan:3,harehime:2}],
["夜のひとり時間","🌙",{setoka:5,benimadonna:4,kanpei:3}]
]},
{
title:"好きな食感",icon:"🍊",options:[
["とろける","✨",{benimadonna:6,setoka:5}],
["シャキシャキ","⚡",{kanpei:7}],
["プリっと弾力感","💫",{dekopon:6}],
["じゅわっと果汁たっぷり","💧",{iyokan:5,setoka:4,harehime:3,karamandarin:2}],
["優しく食べやすい","😊",{unshu:5,harehime:4}],
["薄皮ごとなめらか","🌱",{benimadonna:4,setoka:4,unshu:3,harehime:3}]
]},
{
title:"甘さの好み",icon:"🍯",options:[
["とにかく甘い！","😍",{kanpei:6,setoka:6,benimadonna:5}],
["しっかり甘い","😋",{benimadonna:5,setoka:5,kanpei:5,dekopon:3}],
["程よい甘さ","🙂",{unshu:4,harehime:4,iyokan:3,karamandarin:3,dekopon:2}],
["甘さ控えめ","🌿",{jabara:4,iyokan:3,karamandarin:3}],
["酸味しっかり","⚡",{jabara:7,iyokan:4,karamandarin:3}],
["酸味は苦手","🙈",{kanpei:6,benimadonna:4,setoka:4}]
]},
{
title:"香りの好み",icon:"🌸",options:[
["芳醇で濃厚","🌺",{setoka:6,benimadonna:5}],
["柑橘らしく力強い","🍊",{iyokan:5,jabara:4}],
["爽やか","🍃",{harehime:5,karamandarin:4,iyokan:3,jabara:2}],
["ほんのり優しい","🌼",{unshu:5,harehime:4}],
["控えめ","🤍",{unshu:4,kanpei:3,dekopon:2}]
]},
{
title:"食べる時の手間は？",icon:"🙌",options:[
["サクッとむきたい","👌",{unshu:6,dekopon:4,harehime:4,karamandarin:4}],
["薄皮ごとパクっと","😋",{unshu:5,harehime:5,kanpei:4,setoka:2}],
["皮が厚くてもOK","💪",{iyokan:4,jabara:3,dekopon:2}],
["小粒で一口で","🔸",{karamandarin:6,unshu:3}],
["カットして丁寧に","🔪",{benimadonna:6,setoka:6}],
["絞りたい","🥤",{jabara:8,iyokan:2}]
]},
{
title:"予算や特別感は？",icon:"💰",options:[
["気軽に買える","🛒",{unshu:6,iyokan:3,harehime:3,karamandarin:2}],
["普段は控えめ、たまの贅沢","🎈",{dekopon:4,harehime:3,kanpei:3}],
["ちょっと奮発","✨",{kanpei:5,setoka:4,benimadonna:4}],
["値段なんて気にしない","👑",{benimadonna:5,setoka:5,kanpei:5}],
["特別な贅沢","💎",{benimadonna:7,setoka:6,kanpei:5}]
]},
{
title:"いつ食べたい？",icon:"📅",options:[
["9～11月","🍂",{unshu:8}],
["12月","🎄",{unshu:4,benimadonna:7,iyokan:5,jabara:5,karamandarin:4}],
["1月","❄️",{unshu:4,benimadonna:5,iyokan:5,jabara:5,harehime:5,karamandarin:4}],
["2月","⛄",{unshu:3,kanpei:6,iyokan:4,dekopon:6,jabara:4,harehime:5,setoka:6,karamandarin:3}],
["3月","🌸",{kanpei:6,dekopon:6,harehime:5,setoka:6}],
["冬の間ずっと","🧣",{unshu:5,iyokan:4,harehime:4,dekopon:3}],
["いつでもOK","🌈",{}]
]}
];

const content=document.getElementById("content");
const progressWrap=document.getElementById("progressWrap");
const progressBar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");

let current=0;
let scores={};
let answers=[];

function resetScores(){scores={};fruitKeys.forEach(k=>scores[k]=0)}
function showStart(){
current=0;answers=[];resetScores();progressWrap.classList.add("hidden");
content.innerHTML=`<div class="start screen"><div class="hero-fruit">🍊</div><h2>今日のあなたに合う柑橘は？</h2><p>気分や食べるシーン、食感、甘さ、香りなど8つの質問から診断します。</p><button class="primary" onclick="startDiagnosis()">診断をはじめる →</button></div>`;
}
function startDiagnosis(){current=0;answers=[];resetScores();showQuestion()}
function showQuestion(){
const q=questions[current];
progressWrap.classList.remove("hidden");
progressBar.style.width=((current+1)/questions.length*100)+"%";
progressText.textContent=`${current+1} / ${questions.length}`;
const opts=q.options.map((o,i)=>`<button class="choice" onclick="selectOption(${i})"><span class="choice-emoji">${o[1]}</span><span class="choice-text">${o[0]}</span><span class="choice-arrow">›</span></button>`).join("");
content.innerHTML=`<div class="screen"><div class="q-icon">${q.icon}</div><div class="q-kicker">QUESTION ${current+1}</div><h2 class="question">${q.title}</h2><div class="choices">${opts}</div><div class="nav"><button class="nav-btn" onclick="goBack()" ${current===0?"disabled":""}>← 前の質問</button><button class="nav-btn" onclick="showStart()">最初から</button></div></div>`;
window.scrollTo({top:0,behavior:"smooth"});
}
function selectOption(i){
answers[current]=i;
recalculateScores();
if(current<questions.length-1){current++;showQuestion()}else{showResult()}
}
function recalculateScores(){
resetScores();
answers.forEach((optIndex,qIndex)=>{
if(optIndex===undefined)return;
const weights=questions[qIndex].options[optIndex][2];
Object.entries(weights).forEach(([k,v])=>scores[k]+=v);
});
}
function goBack(){
if(current===0)return;
current--;
answers=answers.slice(0,current+1);
recalculateScores();
showQuestion();
}
function showResult(){
recalculateScores();
const ranking=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
const topKey=ranking[0][0],topScore=ranking[0][1];
const maxPossible=ranking.reduce((m,x)=>Math.max(m,x[1]),0)||1;
const match=Math.min(99,Math.max(72,Math.round(72+(topScore/(topScore+15))*27)));
const f=fruits[topKey];
progressBar.style.width="100%";progressText.textContent="RESULT";
const runner=ranking.slice(1,3).map(([k,s],idx)=>`<div class="runnerup"><span>${idx+2}位　${fruits[k].name}</span><strong>${Math.max(60,match-(idx+1)*7)}%</strong></div>`).join("");
content.innerHTML=`<div class="result screen"><div class="result-tag">YOUR CITRUS</div><div class="result-fruit">${f.emoji}</div><h2>${f.name}</h2><div class="match">あなたとの相性 ${match}%</div><div class="catch">${f.catchcopy}</div><div class="reason"><strong>🍊 あなたにおすすめの理由</strong><br><br>${f.reason}</div><div class="grid"><div class="info"><div class="info-label">味わい</div><div class="info-value">${f.taste}</div></div><div class="info"><div class="info-label">食感</div><div class="info-value">${f.texture}</div></div><div class="info"><div class="info-label">旬</div><div class="info-value">${f.season}</div></div><div class="info"><div class="info-label">糖度の目安</div><div class="info-value">${f.sweetness}</div></div><div class="info wide"><div class="info-label">おすすめの食べ方</div><div class="info-value">${f.eat}</div></div></div><div class="runnerups"><h3>ほかに相性のいい柑橘</h3>${runner}</div><button class="retry" onclick="showStart()">もう一度診断する</button></div>`;
window.scrollTo({top:0,behavior:"smooth"});
}
showStart();
</script>
</body>
</html>
