<div class="wrap">
<header><span class="brand">みかんをもっと楽しく</span></header>
<main id="main">
<section id="home" aria-labelledby="home-title">
<div class="hero"><p class="eyebrow">CITRUS CHART</p><h1 id="home-title" tabindex="-1">みかんをもっと楽しく</h1><p class="intro">今日食べたい味も、友達との付き合い方も。<br>気になるチャートを選んでみよう。</p></div>
<p class="scope">愛媛県中予地域で生産されている柑橘を中心に紹介します。</p>
<div class="cards" id="diagnosis-cards"></div>
<a class="version-link" href="citrus-chart-kids.html#home">子ども版はこちら →</a>

</section>
<section id="diagnosis" class="detail" aria-labelledby="diagnosis-title" hidden>
<div class="hero diagnosis-hero"><p class="eyebrow">CITRUS CHART</p><h1>みかんをもっと楽しく</h1></div>
<button type="button" class="back" data-home>← チャート一覧に戻る</button>
<div class="panel"><span class="tag" id="diagnosis-tag"></span><h2 id="diagnosis-title" tabindex="-1"></h2><p class="description" id="diagnosis-description"></p><div class="steps"><p>このチャートの楽しみ方</p><ol id="diagnosis-steps"></ol></div>
<!-- 質問と結果はこの領域に描画します。入口と戻る操作はそのまま利用できます。 -->
<div id="quiz-content"><p class="status" role="status">質問・診断結果は準備中です。公開までお楽しみに。</p></div>
<button type="button" class="return" data-home>ほかのチャートを見る</button>
<div id="quiz-notes" class="result-notes" hidden></div></div>
</section>
</main>
<footer><span>みかんをもっと楽しく</span></footer>
</div>
<script>

  for (const [className, value] of [
    ['number', 'CHART 0' + (index + 1)], ['card-title', item.title],
    ['card-description', item.summary], ['card-action', 'チャートを開く →']
  ]) {
    const span = document.createElement('span'); span.className = className; span.textContent = value;if(className==='card-description'){const full=document.createElement('span');full.className='desktop-summary';full.textContent=value;const compact=document.createElement('span');compact.className='mobile-summary';compact.textContent=({today:'味や食べ方から、今日の柑橘を探そう。',favorite:'あなたを柑橘の人格にたとえてみよう。',personality:'あなたに合う、じゃばら商品を探そう。'})[id];span.replaceChildren(full,compact);}button.appendChild(span);

  button.addEventListener('click', () => { lastSelected = id; location.hash = id; });

const progressPrefix='mikan-progress-v3-adult-';

function readQuizProgress(id){try{const s=JSON.parse(localStorage.getItem(progressPrefix+id));if(s?.version===1&&Number.isInteger(s.step)&&s.step>=0&&s.step<=12)return s;}catch{}return null;}
function clearQuizProgress(id){try{localStorage.removeItem(progressPrefix+id);}catch{}}
function saveQuizProgress(id,state,complete){try{if(complete){clearQuizProgress(id);return;}localStorage.setItem(progressPrefix+id,JSON.stringify({version:1,...state}));}catch{}}

function arrangeQuizOptions(stage){
 const tiles=stage.querySelectorAll('.viz-tile');tiles.forEach(tile=>tile.classList.toggle('option-long',[...tile.textContent].length>22));
 document.body.classList.add('quiz-active');document.body.classList.toggle('quiz-question',!!stage.querySelector('.viz-grid'));
}
function scrollQuizHeading(h,stage){
 arrangeQuizOptions(stage);
 if(window.matchMedia('(max-width:700px)').matches){window.scrollTo({top:0,left:0,behavior:'auto'});}else h.scrollIntoView?.({block:'start'});
}

function renderQuiz(id){
 document.body.classList.remove('quiz-active','quiz-question');
 const container=document.getElementById('quiz-content'),notes=document.getElementById('quiz-notes');notes.replaceChildren();notes.hidden=true;container.replaceChildren();
 function launch(){
  if(id==='today'){container.innerHTML='<div id="citrus-match"><div id="cm-path" aria-label="これまでの回答"></div><div id="cm-stage"></div></div>';initTodayQuiz();}
  else {const stage=document.createElement('div');stage.id=id==='favorite'?'personality-stage':'jabara-stage';container.replaceChildren(stage);if(id==='favorite')initPersonalityQuiz();else initJabaraQuiz();}
 }
 if(id==='personality'){
  const p=document.createElement('p');p.className='text-small';p.append('商品情報は、こちらのサイトを参考にしています：');const a=document.createElement('a');a.textContent='内子フレッシュパークからり 公式オンラインショップ';a.href='https://kararishop.jp/?cbid=2480555&csid=0&mode=cate';a.target='_blank';a.rel='noopener noreferrer';p.append(a);container.append(p);
 }
 const saved=readQuizProgress(id);
 if(saved?.step>0){const p=document.createElement('p');p.textContent='途中までの回答があります。';container.append(p);const resume=document.createElement('button');resume.type='button';resume.className='return';resume.textContent='続きから再開';resume.onclick=launch;container.append(resume);}
 const start=document.createElement('button');start.type='button';start.className='return';start.textContent=saved?.step>0?'最初からはじめる':'診断をはじめる';start.onclick=()=>{clearQuizProgress(id);launch();};container.append(start);
}

const todayMonths={autumn:[9,10,11],december:[12],january:[1],february:[2],march:[3],spring:[4,5],winter:[12,1,2],anytime:[]};
function todayCandidates(a){
 // 用途と、具体的に希望した食べ方を満たす候補に限定する。
 return citrusData.filter(f=>a.mode==='juice'?['jabara','iyokan'].includes(f.id):f.id!=='jabara')
 .filter(f=>a.mode==='juice'||!['quick','whole','cut'].includes(a.effort)||todayMatches(f,'effort',a.effort))
 .filter(f=>a.mode!=='juice'||!a.recipe||a.recipe==='any'||todayMatches(f,'recipe',a.recipe));
}
function todayMatches(f,key,value){
 if(value==='any'||!value)return false;
 if(key==='effort'&&value==='quick'&&f.id==='iyokan')return false;
 if(key==='effort'&&value==='peel')return f.id==='iyokan';
 if(key==='texture'&&value==='jelly')return f.id==='beni';
 if(key==='texture'&&value==='melt')return f.id==='setoka';
 if(key==='aroma'&&value==='orange')return f.id==='harehime';
 if(key==='recipe')return (f.id==='jabara'&&['drink','dish','bake'].includes(value))||(f.id==='iyokan'&&value==='drink');
 return !!f.matches[key]?.includes(value);
}
function todayQuestionsFor(a){
 const keys=['mood','scene','mode',...(a.mode==='juice'?['preparation','taste','recipe']:['effort','taste','texture','aroma']),'timing','focus'];
 return keys.map(key=>{
  const q=todayFlow[key];let options=q.options;
  if(['taste','texture','aroma'].includes(key))options=options.filter(([value])=>value==='any'||todayCandidates(a).some(f=>todayMatches(f,key,value)));
  if(key==='effort'&&a.mode==='eat')options=options.filter(([v])=>v!=='peel'||a.scene!=='outside');
  if(key==='focus'){
   options=(a.mode==='juice'?['taste','recipe']:['taste','texture','aroma','effort'])
    .filter(k=>a[k]&& !['any','anytime'].includes(a[k])&& (k==='timing'||todayCandidates(a).some(f=>todayMatches(f,k,a[k]))))
    .map(k=>[k,{taste:'味の好み',texture:'食感',aroma:'香り',effort:'食べ方',recipe:'果汁の使い方',timing:'食べたい時期'}[k]]);
   options.push(['all','選んだ好みをバランスよく']);
  }
  return {key,title:q.title,options};
 }).filter(q=>q.key!=='focus'||q.options.length>1);
}
function rankToday(a){
 const pool=todayCandidates(a),focusActive=['taste','texture','aroma','effort','recipe'].includes(a.focus);
 const focused=focusActive?pool.filter(f=>todayMatches(f,a.focus,a[a.focus])):pool;
 // 優先した好みと用途が両立しない場合は、用途を守り、結果で不一致を明示する。
 const preferred=focused.length?focused:pool,months=todayMonths[a.timing]||[];
 const seasonal=preferred.filter(f=>!months.length||f.months.some(m=>months.includes(m)));
 const candidates=seasonal.length?seasonal:preferred;
 return candidates.map((fruit,index)=>{
  const selected=['taste','texture','aroma','effort','recipe'].filter(k=>a[k]&&a[k]!=='any');
  const matches=selected.filter(k=>todayMatches(fruit,k,a[k])),unmatched=selected.filter(k=>!todayMatches(fruit,k,a[k]));
  const score=matches.length*2+(a.scene==='gift'&&fruit.id==='beni'?1:0);
  return {fruit,index,matches,unmatched,score,seasonAvailable:!months.length||fruit.months.some(m=>months.includes(m)),focusAvailable:!focusActive||todayMatches(fruit,a.focus,a[a.focus])};
 }).sort((a,b)=>b.score-a.score||a.index-b.index);
}
function todayPreparationTip(a,id){
 if(a.mode!=='juice')return '';
 if(id==='iyokan')return {simple:'伊予柑は果汁たっぷり。しぼってジュースとして楽しめます。',mix:'まずは、しぼった伊予柑の果汁をジュースとして味わってみてください。混ぜ方の詳しいアレンジは、今回の資料では確認していません。',make:'伊予柑は、しぼってジュースにする使い方が確認できています。料理やお菓子に使いたい場合は、前の質問で使い方を選び直してみてください。'}[a.preparation];

// 用途・手間・好みをもとに商品を提案します。
// 配点は商品説明をもとにした企画上の対応づけです。効能や味の強さを保証するものではありません。
const jabaraScoreRules={
 soda:{enjoy:{drink:3},occasion:{refresh:2},effort:{ready:3},taste:{gentle:1,balanced:1}},
 conc:{enjoy:{drink:3},occasion:{refresh:1},effort:{mix:3,make:3},taste:{balanced:1,strong:1}},
 marmalade:{enjoy:{eat:3},occasion:{morning:3,cooking:2},effort:{mix:2,make:2},taste:{strong:1},form:{spread:3}},
 peel:{enjoy:{eat:3},occasion:{snack:2,cooking:2},effort:{ready:1,make:2},taste:{balanced:1,strong:1},form:{chew:3}},
 candy:{enjoy:{eat:3},occasion:{snack:2},effort:{ready:1},taste:{strong:1},form:{slow:3}}
};
function rankJabaraProducts(answers){
 let candidates=answers.enjoy==='drink'?['soda','conc']:['marmalade','peel','candy'];
 // 食べものの形を優先。飲み物は、そのまま飲む／混ぜるの希望を守る。
 if(answers.enjoy==='eat'&&answers.form)candidates=candidates.filter(key=>jabaraScoreRules[key].form?.[answers.form]);
 if(answers.enjoy==='drink'&&answers.effort==='ready')candidates=['soda'];
 if(answers.enjoy==='drink'&&['mix','make'].includes(answers.effort))candidates=['conc'];
 return Object.entries(jabaraScoreRules).filter(([key])=>candidates.includes(key)).map(([key,rules],index)=>({key,index,matches:Object.entries(rules).map(([field,values])=>({field,points:values[answers[field]]||0})).filter(m=>m.points>0)}))
 .map(r=>({...r,score:r.matches.reduce((sum,m)=>sum+m.points,0)})).sort((a,b)=>b.score-a.score||a.index-b.index);
}
function chooseJabaraProduct(answers){
 if(answers.enjoy==='use')return 'soap';
 return rankJabaraProducts(answers)[0].key;
}
function jabaraSuggestions(a,key){
 const tips=[];
 if(key==='soap')return ['体を洗うときのアイテムとして使ってみてください。'];
 if(key==='soda')tips.push(a.occasion==='relax'?'お風呂上がりに、そのまま1本。':'リフレッシュしたいときに、そのまま楽しんでみてください。');
 if(key==='conc')tips.push(a.effort==='make'?'炭酸などと合わせて、自分の好みのドリンクを作ってみよう。':'飲みものと混ぜて、じゃばらドリンクを楽しんでみよう。');
 if(key==='marmalade')tips.push(a.occasion==='morning'?'朝のトーストにぬって楽しんでみよう。':a.occasion==='cooking'||a.effort==='make'?'お菓子づくりの材料として楽しんでみよう。':a.occasion==='relax'?'紅茶に加えて、じゃばらの香りと苦みを楽しんでみよう。':'ヨーグルトに混ぜて、おやつの時間に楽しんでみよう。');
 if(key==='peel')tips.push(a.occasion==='cooking'||a.effort==='make'?'パウンドケーキなど、お菓子の材料に使ってみよう。':'そのまま、お茶のお供に楽しんでみよう。');
 if(key==='candy')tips.push('手間をかけず、じゃばらの香りと苦みをじっくり楽しんでみよう。');
 if(a.taste==='strong')tips.push('じゃばらの風味に注目して味わってみてください。');
 if(a.taste==='gentle')tips.push(key==='conc'?'飲みものと合わせる量は、商品の案内を見ながら好みに合わせてください。':'味の感じ方は人によって違います。まずは少しずつ楽しんでみてください。');
 return tips;
}
function jabaraQuestionsFor(enjoy){
 return jabaraQuestions.filter(q=>enjoy!=='drink'||q[1]!=='form').map(q=>{
  let options=q[2];
  if(enjoy==='drink'&&q[1]==='occasion')options=options.filter(o=>o[0]!=='cooking');
  if(enjoy==='drink'&&q[1]==='effort')options=options.filter(o=>o[0]!=='make').map(o=>o[0]==='mix'?['mix','まぜて作りたい']:o);
  if(enjoy==='eat'&&q[1]==='taste')options=options.filter(o=>o[0]!=='gentle');
  return [q[1]==='form'?'どんな食べ方が好き？':q[0],q[1],options];
 });
}

  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-home]').forEach(button => button.addEventListener('click', () => { location.hash = 'home'; }));
window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
