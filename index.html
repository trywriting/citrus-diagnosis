<div class="wrap">
<header><span class="brand">みかんをもっと楽しく</span></header>
<main id="main">
<section id="home" aria-labelledby="home-title">
<div class="hero"><p class="eyebrow">CITRUS CHART</p><h1 id="home-title" tabindex="-1">みかんをもっと楽しく</h1><p class="intro">今日食べたい味も、友達との付き合い方も。<br>気になるチャートを選んでみよう。</p></div>
<p class="scope">愛媛県中予地域で生産されている柑橘を中心に紹介します。</p>
<div class="cards" id="diagnosis-cards"></div>

</section>
<section id="diagnosis" class="detail" aria-labelledby="diagnosis-title" hidden>
<button type="button" class="back" data-home>← チャート一覧に戻る</button>
<div class="panel"><span class="tag" id="diagnosis-tag"></span><h2 id="diagnosis-title" tabindex="-1"></h2><p class="description" id="diagnosis-description"></p><div class="steps"><p>このチャートの楽しみ方</p><ol id="diagnosis-steps"></ol></div>
<!-- 質問と結果はこの領域に描画します。入口と戻る操作はそのまま利用できます。 -->
<div id="quiz-content"><p class="status" role="status">質問・診断結果は準備中です。公開までお楽しみに。</p></div>
<button type="button" class="return" data-home>ほかのチャートを見る</button>
<div id="quiz-notes" class="result-notes" hidden></div></div>
</section>
</main>
<footer><span>みかんをもっと楽しく</span></footer>
</div>

Object.entries(diagnoses).forEach(([id, item], index) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'card'; button.dataset.diagnosis = id;
  for (const [className, value] of [
    ['number', 'CHART 0' + (index + 1)], ['card-title', item.title],
    ['card-description', item.summary], ['card-action', 'チャートを開く →']
  ]) {
    const span = document.createElement('span'); span.className = className; span.textContent = value; button.appendChild(span);
  }
  button.addEventListener('click', () => { lastSelected = id; location.hash = id; });

});
function renderQuiz(id) {
  const notes=document.getElementById('quiz-notes');notes.replaceChildren();notes.hidden=true;
  if (id === 'today') {
    const container = document.getElementById('quiz-content');
    const start = document.createElement('button');
    start.type = 'button'; start.className = 'return'; start.textContent = '診断をはじめる';
    start.addEventListener('click', () => {
      container.innerHTML = '<div id="citrus-match"><div id="cm-path" aria-label="これまでの回答"></div><div id="cm-stage"></div></div>';
      initTodayQuiz();
    });
    container.replaceChildren(start);
    return;
  }
  if(id==='favorite'){
    const container=document.getElementById('quiz-content'),start=document.createElement('button');
    start.type='button';start.className='return';start.textContent='診断をはじめる';
    start.addEventListener('click',()=>{const stage=document.createElement('div');stage.id='personality-stage';container.replaceChildren(stage);initPersonalityQuiz();});
    container.replaceChildren(start);return;
  }
  if(id==='personality'){
    const container=document.getElementById('quiz-content'),start=document.createElement('button');start.type='button';start.className='return';start.textContent='診断をはじめる';

  }
  // 未知の診断IDへの予備表示。
  const status = document.createElement('p'); status.className = 'status'; status.setAttribute('role', 'status');
  status.textContent = '質問・診断結果は準備中です。公開までお楽しみに。';
  document.getElementById('quiz-content').replaceChildren(status);
}

const timingMonths = {autumn:[9,10,11],december:[12],january:[1],february:[2],march:[3],spring:[4,5],winter:[12,1,2],anytime:[]};
// 一致する回答を各1点として数えます。これは検索用の対応づけで、糖度や香りの強度の順位ではありません。
function rankCitrus(answers) {
 const months=timingMonths[answers.timing] || [];
 const cooking=answers.scene==='cooking'||answers.effort==='squeeze';
 return citrusData.filter(f=>!months.length||f.months.some(m=>months.includes(m)))
 .filter(f=>f.id!=='jabara'||cooking)
 .map((fruit,index)=>({fruit,index,matches:todayQuestions.filter(q=>fruit.matches[q[1]]?.includes(answers[q[1]]))}))
 .map(item=>({...item,score:item.matches.length})).sort((a,b)=>b.score-a.score||a.index-b.index);
}

const jabaraProducts={
  "soda": {
    "name": "内子からりじゃばらサイダー",
    "detail": "そのまま飲める、じゃばらのサイダー。酸味と苦みを飲みもので楽しめます。",
    "tip": "お風呂上がりの1本にも。"

  "marmalade": {

  }
};
// 用途・手間・好みをもとに商品を提案します。
// 配点は商品説明をもとにした企画上の対応づけです。効能や味の強さを保証するものではありません。
const jabaraScoreRules={
 soda:{enjoy:{drink:3},occasion:{refresh:2},effort:{ready:3},taste:{gentle:1,balanced:1}},
 conc:{enjoy:{drink:3},occasion:{refresh:1},effort:{mix:3,make:3},taste:{balanced:1,strong:1}},
 marmalade:{enjoy:{eat:3},occasion:{morning:3,cooking:2},effort:{mix:2,make:2},taste:{strong:1},form:{spread:3}},
 peel:{enjoy:{eat:3},occasion:{snack:2,cooking:2},effort:{ready:1,make:2},taste:{balanced:1,strong:1},form:{chew:3}},
 candy:{enjoy:{eat:3},occasion:{snack:2},effort:{ready:1},taste:{strong:1},form:{slow:3}}
};
function rankJabaraProducts(answers){
 const candidates=answers.enjoy==='drink'?['soda','conc']:['marmalade','peel','candy'];
 return Object.entries(jabaraScoreRules).filter(([key])=>candidates.includes(key)).map(([key,rules],index)=>({key,index,matches:Object.entries(rules).map(([field,values])=>({field,points:values[answers[field]]||0})).filter(m=>m.points>0)}))
 .map(r=>({...r,score:r.matches.reduce((sum,m)=>sum+m.points,0)})).sort((a,b)=>b.score-a.score||a.index-b.index);
}
function chooseJabaraProduct(answers){
 if(answers.enjoy==='use')return 'soap';
 return rankJabaraProducts(answers)[0].key;
}
function jabaraSuggestions(a,key){
 const tips=[];
 if(key==='soap')return ['体を洗うときのアイテムとして使ってみてください。'];
 if(key==='soda')tips.push(a.occasion==='relax'?'お風呂上がりに、そのまま1本。':'リフレッシュしたいときに、そのまま楽しんでみてください。');
 if(key==='conc')tips.push(a.effort==='make'?'炭酸などと合わせて、自分の好みのドリンクを作ってみよう。':'飲みものと混ぜて、じゃばらドリンクを楽しんでみよう。');
 if(key==='marmalade')tips.push(a.occasion==='morning'?'朝のトーストにぬって楽しんでみよう。':a.occasion==='cooking'||a.effort==='make'?'お菓子づくりの材料として楽しんでみよう。':a.occasion==='relax'?'紅茶に加えて、じゃばらの香りと苦みを楽しんでみよう。':'ヨーグルトに混ぜて、おやつの時間に楽しんでみよう。');
 if(key==='peel')tips.push(a.occasion==='cooking'||a.effort==='make'?'パウンドケーキなど、お菓子の材料に使ってみよう。':'そのまま、お茶のお供に楽しんでみよう。');
 if(key==='candy')tips.push('手間をかけず、じゃばらの香りと苦みをじっくり楽しんでみよう。');
 if(a.taste==='strong')tips.push('じゃばらの風味に注目して味わってみてください。');
 if(a.taste==='gentle')tips.push(key==='conc'?'飲みものと合わせる量は、商品の案内を見ながら好みに合わせてください。':'味の感じ方は人によって違います。まずは少しずつ楽しんでみてください。');
 return tips;
}
function jabaraQuestionsFor(enjoy){
 return jabaraQuestions.filter(q=>enjoy!=='drink'||q[1]!=='form').map(q=>{
  let options=q[2];
  if(enjoy==='drink'&&q[1]==='occasion')options=options.filter(o=>o[0]!=='cooking');
  if(enjoy==='drink'&&q[1]==='effort')options=options.filter(o=>o[0]!=='make').map(o=>o[0]==='mix'?['mix','まぜて作りたい']:o);
  if(enjoy==='eat'&&q[1]==='taste')options=options.filter(o=>o[0]!=='gentle');
  return [q[1]==='form'?'どんな食べ方が好き？':q[0],q[1],options];
 });
}
function initJabaraQuiz(){
 const stage=document.getElementById('jabara-stage'),notes=document.getElementById('quiz-notes');let answers={},step=0;
 function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
 function button(text,fn){const b=el('button',text,'btn');b.type='button';b.onclick=fn;return b;}
 function render(){
 stage.replaceChildren();notes.replaceChildren();notes.hidden=true;
 const questions=jabaraQuestionsFor(answers.enjoy);
 if(step===questions.length){
 const key=chooseJabaraProduct(answers),product=jabaraProducts[key];
 stage.append(el('p','あなたにおすすめのじゃばら商品は…','personality-label'));
 const card=el('div',undefined,'card');card.append(el('h3',product.name),el('p',product.detail),el('p',product.tip));stage.append(card);
 const choice=q=>q[2].find(o=>o[0]===answers[q[1]])[1];
 stage.append(el('p','最初に選んだ楽しみ方：'+choice(questions[0])));
 stage.append(el('p','こんな楽しみ方はいかが？'));const list=el('ul');jabaraSuggestions(answers,key).forEach(text=>list.append(el('li',text)));stage.append(list);
 if(answers.enjoy!=='use'){const ranked=rankJabaraProducts(answers),reasons=ranked.find(r=>r.key===key).matches;const labels=reasons.map(m=>{const q=questions.find(q=>q[1]===m.field);return choice(q);});stage.append(el('p','おすすめにつながった回答：'+labels.join('／')));}
 
 stage.append(button('もう一度診断する',()=>{answers={};step=0;render();}),button('回答を見直す',()=>{step=answers.enjoy==='use'?0:questions.length-1;render();}));
 notes.hidden=false;notes.append(el('p','選んだ楽しみ方に合わせて、場面・手間・味・食べものの形を組み合わせて商品を提案します。商品の情報は提供いただいた説明に基づきます。健康への効果や、添加物の有無による安全性は判定していません。'));
 }else{
 const q=questions[step];stage.append(el('p',(step+1)+' / '+questions.length,'text-small'),el('h3',q[0]));


 const group=el('div',undefined,'viz-grid');q[2].forEach(([value,label])=>{const b=button(label,()=>{answers[q[1]]=value;for(const later of jabaraQuestions.slice(jabaraQuestions.findIndex(item=>item[1]===q[1])+1))delete answers[later[1]];step=q[1]==='enjoy'&&value==='use'?jabaraQuestionsFor(value).length:step+1;render();});b.classList.add('viz-tile');b.setAttribute('aria-pressed',String(answers[q[1]]===value));group.append(b);});stage.append(group);
 if(step>0)stage.append(button('前の質問へ',()=>{step--;render();}));
 }
 queueMicrotask(()=>{const h=stage.querySelector('h3');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView?.({block:'start'});}});
 }
 render();
}

function renderRoute() {
  const id = location.hash.slice(1);
  const item = Object.prototype.hasOwnProperty.call(diagnoses, id) ? diagnoses[id] : null;
  home.hidden = !!item; detail.hidden = !item;
  if (item) {
    document.getElementById('diagnosis-tag').textContent = item.tag;
    document.getElementById('diagnosis-title').textContent = item.title;
    document.getElementById('diagnosis-description').textContent = item.description;
    const steps = document.getElementById('diagnosis-steps'); steps.replaceChildren();
    item.steps.forEach(text => { const li = document.createElement('li'); li.textContent = text; steps.appendChild(li); });
    renderQuiz(id); document.title = item.title + ' | みかんをもっと楽しく';
    document.getElementById('diagnosis-title').focus({preventScroll:true});
  } else {
    document.title = 'みかんをもっと楽しく';
    const previous = Array.from(cards.children).find(button => button.dataset.diagnosis === lastSelected);
    (previous || document.getElementById('home-title')).focus({preventScroll:true});
  }
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-home]').forEach(button => button.addEventListener('click', () => { location.hash = 'home'; }));
window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
