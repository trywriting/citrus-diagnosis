<div class="wrap">
<header><span class="brand">みかんチャート <small>こども版</small></span></header>
<main id="main">
<section id="home" aria-labelledby="home-title">
<div class="hero"><p class="eyebrow">こども版</p><h1 id="home-title" tabindex="-1">どんな みかんが すき？</h1><p class="intro">食べたいみかんを、さがしてみよう。<br>下のボタンをおして、はじめよう。</p></div>
<p class="scope">愛媛（えひめ）の中予（ちゅうよ）で育つ、みかんを中心にしょうかいするよ。</p>
<div class="cards" id="diagnosis-cards"></div>
<p class="note">4つのしつもんにこたえて、食べたいみかんをさがそう。</p>
<a class="version-link" href="index.html#home">← 通常版はこちら</a>
</section>
<section id="diagnosis" class="detail" aria-labelledby="diagnosis-title" hidden>
<button type="button" class="back" data-home>← はじめのページへ</button>
<div class="panel"><span class="tag" id="diagnosis-tag"></span><h2 id="diagnosis-title" tabindex="-1"></h2><p class="description" id="diagnosis-description"></p><div class="steps"><p>あそび方</p><ol id="diagnosis-steps"></ol></div>
<!-- 質問と結果はこの領域に描画します。入口と戻る操作はそのまま利用できます。 -->
<div id="quiz-content"><p class="status" role="status">このチャートは、じゅんび中です。またあそびにきてね。</p></div>
<button type="button" class="return" data-home>はじめのページへ</button>
<details id="kids-adult-notes" class="result-notes" hidden><summary>おとなの方へ：このチャートについて</summary><div id="quiz-notes" hidden></div></details></div>
</section>
</main>
<footer><span>みかんチャート <small>こども版</small></span><span>みかんを、もっと楽しく。</span></footer>
</div>

const home = document.getElementById('home');

const cards = document.getElementById('diagnosis-cards');
let lastSelected = null;
Object.entries(diagnoses).forEach(([id, item], index) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'card'; button.dataset.diagnosis = id;
  for (const [className, value] of [
    ['number', 'その' + (index + 1)], ['card-title', item.title],
    ['card-description', item.summary], ['card-action', id==='today'?'やってみる →':'じゅんび中 →']
  ]) {
    const span = document.createElement('span'); span.className = className; span.textContent = value; button.appendChild(span);
  }
  button.addEventListener('click', () => { lastSelected = id; location.hash = id; });
  cards.appendChild(button);
});
function renderQuiz(id) {
  const notes=document.getElementById('quiz-notes');notes.replaceChildren();notes.hidden=true;document.getElementById('kids-adult-notes').hidden=true;
  if (id === 'today') {
    const container = document.getElementById('quiz-content');
    const start = document.createElement('button');
    start.type = 'button'; start.className = 'return'; start.textContent = 'はじめる';
    start.addEventListener('click', () => {
      container.innerHTML = '<div id="citrus-match"><div id="cm-path" aria-label="これまでの回答"></div><div id="cm-stage"></div></div>';

    });
    container.replaceChildren(start);
    return;
  }
  // 今後の拡張ポイント：diagnoses[id].questions を使い、質問・結果を表示。
  const status = document.createElement('p'); status.className = 'status'; status.setAttribute('role', 'status');
  status.textContent = 'このチャートは、じゅんび中です。またあそびにきてね。';
  document.getElementById('quiz-content').replaceChildren(status);
}

      "effort": [

    },
    "sources": [

      ],

    "region": "内子町",

];
const todayQuestions = [

const timingMonths = {autumn:[9,10,11],december:[12],january:[1],february:[2],march:[3],spring:[4,5],winter:[12,1,2],anytime:[]};
// 一致する回答を各1点として数えます。これは検索用の対応づけで、糖度や香りの強度の順位ではありません。
function rankCitrus(answers) {
 const months=timingMonths[answers.timing] || [];
 const cooking=answers.scene==='cooking'||answers.effort==='squeeze';
 return citrusData.filter(f=>!months.length||f.months.some(m=>months.includes(m)))
 .filter(f=>f.id!=='jabara'||cooking)
 .map((fruit,index)=>({fruit,index,matches:todayQuestions.filter(q=>fruit.matches[q[1]]?.includes(answers[q[1]]))}))
 .map(item=>({...item,score:item.matches.length})).sort((a,b)=>b.score-a.score||a.index-b.index);
}
function initTodayQuiz() {
 const root=document.getElementById('citrus-match');
 const stage=root.querySelector('#cm-stage'),path=root.querySelector('#cm-path');
 const notes=document.getElementById('quiz-notes');
 const questions=todayQuestions;
 let answers={},step=0;
 function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
 function button(label,fn){const b=el('button',label,'btn');b.type='button';b.onclick=fn;return b;}
 function sources(parent,entries){const p=el('p',undefined,'text-small');p.append(el('span','参考：'));entries.forEach(([label,url],i)=>{if(i)p.append(el('span',' ／ '));const a=el('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);});parent.append(p);}
 function showFruit(parent,f){
 const card=el('div',undefined,'card');const heading=el('h3');if(f.name!==f.reading){const ruby=el('ruby');ruby.append(el('span',f.name),el('rt',f.reading));heading.append(ruby);}else{heading.textContent=f.name;}card.append(heading);
 const dl=el('dl',undefined,'facts');for(const [key,label] of [['sweet','味'],['texture','食べごこち'],['aroma','かおり']]){dl.append(el('dt',label),el('dd',f.facts[key] || ''));}card.append(dl);
 card.append(el('p','食べ方：'+f.eat));
 const extra=el('details');extra.append(el('summary','おとなの方へ：時期と参考情報'),el('p','出荷時期の目安：'+f.season),el('p','栽培確認地域：'+f.region));
 if(f.note)extra.append(el('p',f.note,'text-small'));
 sources(extra,f.sources);sources(extra,[['栽培地域の根拠',f.regionSource]]);card.append(extra);parent.append(card);
 }
 function render(){
 notes.replaceChildren();notes.hidden=true;document.getElementById('kids-adult-notes').hidden=true;
 path.replaceChildren();questions.forEach(q=>{const o=q[2].find(o=>o[0]===answers[q[1]]);if(o)path.append(el('span',o[1]));});stage.replaceChildren();
 if(step===questions.length){
 const ranked=rankCitrus(answers),best=ranked[0];
 stage.append(el('h3',best?.score>0?'こんな みかんは どう？':'もういちど、えらんでみよう'));
 if(best?.score>0){
 showFruit(stage,best.fruit);
 const labels=best.matches.map(q=>q[2].find(o=>o[0]===answers[q[1]])[1]);
 stage.append(el('p','えらんだ答えと、合うところ：'+labels.join('／')));
 const tied=ranked.filter(r=>r.score===best.score).slice(1);
 if(tied.length){stage.append(el('p','こんな みかんも、合っているよ。'));
 tied.forEach(item=>{const d=el('details');d.append(el('summary',item.fruit.reading+'を見てみる'));showFruit(d,item.fruit);stage.append(d);});}
 }else{stage.append(el('p','えらんだ答えに合うみかんが、見つからなかったよ。答えをかえてみる？'));
 ranked.forEach(item=>{const d=el('details');d.append(el('summary',item.fruit.name+'の特徴を見る'));showFruit(d,item.fruit);stage.append(d);});}
 const unused=questions.filter(q=>{const v=answers[q[1]];return q[1]!=='timing'&&!citrusData.some(f=>f.matches[q[1]]?.includes(v));}).map(q=>q[0]);
 notes.hidden=false;document.getElementById('kids-adult-notes').hidden=false;
 if(unused.length)notes.append(el('p','根拠が未確認のため判定に使用していない回答項目：'+unused.join('・')));
 notes.append(el('p','出荷時期は愛媛県の情報シートを使用しています（温州みかんはJAえひめ中央）。選んだ期間の一部と重なる柑橘を候補にしています。期間全体の販売や、内子町・各店舗での在庫を保証するものではありません。'));
 notes.append(el('p','特徴欄の空欄は未確認です。気分や価格と品種の関係は判定に使用していません。'));
 stage.append(button('もういちど あそぶ',()=>{answers={};step=0;render();}),button('答えをかえる',()=>{step=questions.length-1;render();}));
 }else{
 const q=questions[step];stage.append(el('div',(step+1)+'もんめ ／ '+questions.length+'もん','text-small'),el('h3',q[0]));


 const group=el('div',undefined,'viz-grid');q[2].forEach(([value,label])=>{const b=button(label,()=>{answers[q[1]]=value;for(let n=step+1;n<questions.length;n++)delete answers[questions[n][1]];step++;render();});b.classList.add('viz-tile');b.setAttribute('aria-pressed',String(answers[q[1]]===value));group.append(b);});stage.append(group);
 if(step>0)stage.append(button('ひとつ もどる',()=>{step--;render();}));
 }
 queueMicrotask(()=>{const h=stage.querySelector('h3');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView?.({block:'start'});}});
 }
 render();
}

function renderRoute() {
  const id = location.hash.slice(1);
  const item = Object.prototype.hasOwnProperty.call(diagnoses, id) ? diagnoses[id] : null;
  home.hidden = !!item; detail.hidden = !item;
  if (item) {
    document.getElementById('diagnosis-tag').textContent = item.tag;
    document.getElementById('diagnosis-title').textContent = item.title;
    document.getElementById('diagnosis-description').textContent = item.description;
    const steps = document.getElementById('diagnosis-steps'); steps.replaceChildren();
    item.steps.forEach(text => { const li = document.createElement('li'); li.textContent = text; steps.appendChild(li); });
    renderQuiz(id); document.title = item.title + '｜こども版';
    document.getElementById('diagnosis-title').focus({preventScroll:true});
  } else {
    document.title = 'みかんチャート｜こども版';
    const previous = Array.from(cards.children).find(button => button.dataset.diagnosis === lastSelected);
    (previous || document.getElementById('home-title')).focus({preventScroll:true});
  }
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-home]').forEach(button => button.addEventListener('click', () => { location.hash = 'home'; }));
window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
