<body>
<div class="wrap">
<header><span class="brand">みかんチャート <small>こども版</small></span></header>
<main id="main">
<section id="home" aria-labelledby="home-title">
<div class="hero"><p class="eyebrow">こども版</p><h1 id="home-title" tabindex="-1">どんな みかんが すき？</h1><p class="intro">食べたいみかんを、さがしてみよう。<br>下のボタンをおして、はじめよう。</p></div>
<p class="scope">愛媛（えひめ）の中予（ちゅうよ）で育つ、みかんを中心にしょうかいするよ。</p>
<div class="cards" id="diagnosis-cards"></div>
<p class="note">4つのしつもんにこたえて、食べたいみかんをさがそう。</p>
<a class="version-link" href="index.html#home">← 通常版はこちら</a>
</section>
<section id="diagnosis" class="detail" aria-labelledby="diagnosis-title" hidden>
<button type="button" class="back" data-home>← はじめのページへ</button>
<div class="panel"><span class="tag" id="diagnosis-tag"></span><h2 id="diagnosis-title" tabindex="-1"></h2><p class="description" id="diagnosis-description"></p><div class="steps"><p>あそび方</p><ol id="diagnosis-steps"></ol></div>
<!-- 質問と結果はこの領域に描画します。入口と戻る操作はそのまま利用できます。 -->
<div id="quiz-content"><p class="status" role="status">このチャートは、じゅんび中です。またあそびにきてね。</p></div>
<button type="button" class="return" data-home>はじめのページへ</button>
<details id="kids-adult-notes" class="result-notes" hidden><summary>おとなの方へ：このチャートについて</summary><div id="quiz-notes" hidden></div></details></div>
</section>
</main>
<footer><span>みかんチャート <small>こども版</small></span><span>みかんを、もっと楽しく。</span></footer>
</div>

const diagnoses = {
 today:{title:'きょう食べたい みかんさがし',tag:'えらぶと、しつもんがかわる',summary:'すきな味をえらんで、食べたいみかんを見つけよう。',description:'ボタンをおすと、つぎのしつもんがかわるよ。すきなものをえらんでね。せいかい・まちがいはないよ。',steps:['すきなものを、ひとつずつえらぶ','みかんの名前と、食べ方を見てみよう']}
};
const home = document.getElementById('home');
const detail = document.getElementById('diagnosis');
const cards = document.getElementById('diagnosis-cards');
let lastSelected = null;
Object.entries(diagnoses).forEach(([id, item], index) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'card'; button.dataset.diagnosis = id;
  for (const [className, value] of [
    ['number', 'その' + (index + 1)], ['card-title', item.title],
    ['card-description', item.summary], ['card-action', id==='today'?'やってみる →':'じゅんび中 →']
  ]) {
    const span = document.createElement('span'); span.className = className; span.textContent = value; button.appendChild(span);
  }
  button.addEventListener('click', () => { lastSelected = id; location.hash = id; });
  cards.appendChild(button);
});
const progressPrefix='mikan-progress-v3-kids-';

function readQuizProgress(id){try{const s=JSON.parse(localStorage.getItem(progressPrefix+id));if(s?.version===1&&Number.isInteger(s.step)&&s.step>=0&&s.step<=12)return s;}catch{}return null;}
function clearQuizProgress(id){try{localStorage.removeItem(progressPrefix+id);}catch{}}
function saveQuizProgress(id,state,complete){try{if(complete){clearQuizProgress(id);return;}localStorage.setItem(progressPrefix+id,JSON.stringify({version:1,...state}));}catch{}}
function renderQuiz(id){
 const container=document.getElementById('quiz-content'),notes=document.getElementById('quiz-notes');notes.replaceChildren();notes.hidden=true;container.replaceChildren();
 function launch(){
  if(id==='today'){container.innerHTML='<div id="citrus-match"><div id="cm-path" aria-label="これまでの回答"></div><div id="cm-stage"></div></div>';initTodayQuiz();}
  else {const stage=document.createElement('div');stage.id=id==='favorite'?'personality-stage':'jabara-stage';container.replaceChildren(stage);if(id==='favorite')initPersonalityQuiz();else initJabaraQuiz();}
 }
 if(id==='personality'){
  const p=document.createElement('p');p.className='text-small';p.append('商品情報は、こちらのサイトを参考にしています：');const a=document.createElement('a');a.textContent='内子フレッシュパークからり 公式オンラインショップ';a.href='https://kararishop.jp/?cbid=2480555&csid=0&mode=cate';a.target='_blank';a.rel='noopener noreferrer';p.append(a);container.append(p);
 }
 const saved=readQuizProgress(id);
 if(saved?.step>0){const p=document.createElement('p');p.textContent='とちゅうまでの答えがあるよ。';container.append(p);const resume=document.createElement('button');resume.type='button';resume.className='return';resume.textContent='つづきから あそぶ';resume.onclick=launch;container.append(resume);}
 const start=document.createElement('button');start.type='button';start.className='return';start.textContent=saved?.step>0?'はじめから あそぶ':'はじめる';start.onclick=()=>{clearQuizProgress(id);launch();};container.append(start);
}

function initTodayQuiz(){
 const root=document.getElementById('citrus-match'),stage=root.querySelector('#cm-stage'),path=root.querySelector('#cm-path'),notes=document.getElementById('quiz-notes');
 let current='start',history=[];
 const saved=readQuizProgress('today');if(saved&&Array.isArray(saved.history)){let node='start';for(const item of saved.history){const q=todayTree[node],option=q?.options.find(o=>o[0]===item.label);if(!option||item.node!==node)break;history.push(item);node=option[1];if(node.startsWith('result:'))break;}current=node;}
 function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
 function button(label,fn){const b=el('button',label,'btn');b.type='button';b.onclick=fn;return b;}
 function goBack(){const previous=history.pop();if(previous)current=previous.node;render();}
 function render(){
  saveQuizProgress('today',{current,history,step:history.length},current.startsWith('result:')||history.length===0);
  stage.replaceChildren();notes.replaceChildren();notes.hidden=true;
  const adultNotes=document.getElementById('kids-adult-notes');if(adultNotes)adultNotes.hidden=true;
  path.replaceChildren();history.forEach(h=>path.append(el('span',h.label)));
  if(current.startsWith('result:')){
   const fruit=citrusData.find(f=>f.id===current.slice(7));
   stage.append(el('h3','こんな みかんは どう？'));
   const card=el('div',undefined,'card');card.append(el('h3',fruit.name));
   const dl=el('dl',undefined,'facts');for(const [key,label] of [['sweet','甘さ・酸味'],['texture','食感'],['aroma','香り']]){if(fruit.facts[key])dl.append(el('dt',label),el('dd',fruit.facts[key]));}card.append(dl);
   card.append(el('p','食べ方：'+fruit.eat),el('p','出荷時期の目安：'+fruit.season));stage.append(card);
   stage.append(el('p','あなたが選んだ楽しみ方：'+history.map(h=>h.label).join(' → ')));
   const extra=el('details');extra.append(el('summary','参考情報を見る'),el('p','栽培確認地域：'+fruit.region));if(fruit.note)extra.append(el('p',fruit.note));
   for(const [label,url] of [...fruit.sources,['栽培地域の根拠',fruit.regionSource]]){const p=el('p'),a=el('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);extra.append(p);}stage.append(extra);
   notes.hidden=false;if(adultNotes)adultNotes.hidden=false;
   notes.append(el('p','特徴をヒントに、おすすめのひとつを紹介しています。同じ特徴を持つ柑橘もあります。出荷時期は目安で、店舗の在庫を保証するものではありません。'));
   stage.append(button('もういちど あそぶ',()=>{history=[];current='start';render();}),button('答えをかえる',goBack));
  }else{
   const node=todayTree[current];stage.append(el('p',(history.length+1)+'問目','text-small'),el('h3',node.question));
   const group=el('div',undefined,'viz-grid');node.options.forEach(([label,next])=>{const b=button(label,()=>{history.push({node:current,label});current=next;render();});b.classList.add('viz-tile');group.append(b);});stage.append(group);
   if(history.length)stage.append(button('ひとつ もどる',goBack));
  }
  queueMicrotask(()=>{const h=stage.querySelector('h3');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView?.({block:'start'});}});
 }
 render();
}

function renderRoute() {
  const id = location.hash.slice(1);
  const item = Object.prototype.hasOwnProperty.call(diagnoses, id) ? diagnoses[id] : null;
  home.hidden = !!item; detail.hidden = !item;
  if (item) {
    document.getElementById('diagnosis-tag').textContent = item.tag;
    document.getElementById('diagnosis-title').textContent = item.title;
    document.getElementById('diagnosis-description').textContent = item.description;
    const steps = document.getElementById('diagnosis-steps'); steps.replaceChildren();
    item.steps.forEach(text => { const li = document.createElement('li'); li.textContent = text; steps.appendChild(li); });
    renderQuiz(id); document.title = item.title + '｜こども版';
    document.getElementById('diagnosis-title').focus({preventScroll:true});
  } else {
    document.title = 'みかんチャート｜こども版';
    const previous = Array.from(cards.children).find(button => button.dataset.diagnosis === lastSelected);
    (previous || document.getElementById('home-title')).focus({preventScroll:true});
  }
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-home]').forEach(button => button.addEventListener('click', () => { location.hash = 'home'; }));
window.addEventListener('hashchange', renderRoute);
renderRoute();
